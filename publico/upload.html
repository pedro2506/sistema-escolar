<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Enviar Imagem</title>
</head>
<body>
  <h1>Enviar Imagem</h1>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="image" accept="image/*" required>
    <button type="submit">Enviar</button>
  </form>
</body>
</html>
